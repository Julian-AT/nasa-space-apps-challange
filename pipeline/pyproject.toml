[project]
name = "terraluna-pipeline"
version = "0.1.0"
description = "Terraluna offline pipeline: product records, fingerprints, comparisons and the release bundle."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "affine>=3.0,<4",
    "numpy>=2.5,<3",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "rasterio>=1.5,<2",
    "scipy>=1.18,<2",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mpmath>=1.4,<2",
    "types-pyyaml>=6.0.12,<7",
]
# Development-only test oracle (PRD 12, D19). polsartools is GPL-3.0 and never a runtime
# dependency: no module under pipeline/src imports it (pipeline/tests/test_polarimetry_oracle.py
# checks this). The group is opt-in, because polsartools needs the GDAL Python bindings, which
# build only against a system GDAL of the same version (gdal-config on PATH). Install with
# `uv sync --locked --group oracle`.
oracle = ["polsartools==0.13"]
