# Virtual uv workspace root (PRD 8.2, 8.3). The root is not a package; the
# members below are. One lockfile, uv.lock, pins every Python dependency.

[tool.uv.workspace]
members = ["pipeline", "ml"]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "jsonschema>=4.26",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "types-jsonschema>=4.26",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["pipeline/src", "ml/src", "pipeline/tests", "ml/tests"]
include = [
    "pipeline/src/**/*.py",
    "ml/src/**/*.py",
    "pipeline/tests/**/*.py",
    "ml/tests/**/*.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["terraluna_pipeline", "terraluna_ml"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline/src", "ml/src", "pipeline/tests", "ml/tests"]
mypy_path = ["pipeline/src", "ml/src", "ml/tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "ml/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

# fast/ml: torch pulls sympy, which caps mpmath below 1.4 while the pipeline's dev oracle needs
# mpmath 1.4; sympy works with 1.4 for torch's use, so the cap is overridden.
[tool.uv]
override-dependencies = ["mpmath>=1.4,<2"]

# fast/ml: third-party packages without type information.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*", "onnxruntime.*", "onnx.*", "rasterio.*", "pyproj.*"]
ignore_missing_imports = true
