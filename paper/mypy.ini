# mypy settings for the paper build scripts (PRD 22.6), used from paper/ by make -C paper check.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
files = scripts

# rasterio ships without type information; scripts/figures.py uses it only to read DEM windows.
[mypy-rasterio.*]
ignore_missing_imports = True
